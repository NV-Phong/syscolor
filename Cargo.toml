[package]
name = "syscolor"
version = "0.1.1"
edition = "2024"
description = "Native Windows utility for refreshing system accent colors after sleep and resume"
license = "MIT"
authors = ["NV-Phong"]
homepage = "https://github.com/NV-Phong/syscolor"
repository = "https://github.com/NV-Phong/syscolor"
keywords = ["windows", "system-colors", "accent", "registry", "utility"]
categories = ["command-line-utilities", "os::windows-apis"]

[[bin]]
name = "syscolor"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
crossterm = "0.28"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.52"
